name: SANTA PR check
description: >-
  Grades a pull request's base and head with the repository's own SANTA runner on SANTA's current vectors
  (./santa-pr), writes the per-entry summary to the job summary and uploads the delta as the artifact `santa-pr` for
  a commenter workflow. It posts nothing and needs only a read-only token, so it is safe on a pull request from a
  fork. SANTA has no entry for the runner: it lives in this repository, and each side of the delta runs its own copy.
inputs:
  runner-path:
    description: The directory of this repository's SANTA runner (its runner.json and santa-run), from the root.
    default: santa
  label:
    description: The runner's name in the comment.
    default: ${{ github.repository }}
  impl-path:
    description: This repository's checkout, with full history (actions/checkout with fetch-depth 0).
    default: ${{ github.workspace }}
  base:
    description: The base commit (a pull request's base by default).
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: The head commit (by default the pull request merged into its base, what merging it would give).
    default: ${{ github.sha }}
  santa-ref:
    description: The SANTA ref whose vectors grade the pull request.
    default: main
runs:
  using: composite
  steps:
    - name: check out SANTA
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        repository: mwaddip/santa
        ref: ${{ inputs.santa-ref }}
        path: .santa-pr/santa # the vectors and the tools; none of SANTA's own runners runs here
        persist-credentials: false
    - name: install mise (the binary; SANTA and the runner provision their own toolchains)
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.5.18
        install: false
    - name: grade the base and the head
      shell: bash
      env:
        RUNNER_PATH: ${{ inputs.runner-path }}
        LABEL: ${{ inputs.label }}
        IMPL: ${{ inputs.impl-path }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
      run: >-
        "$GITHUB_WORKSPACE/.santa-pr/santa/santa-pr" --runner-dir "$RUNNER_PATH" --label "$LABEL"
        "$IMPL" "$BASE" "$HEAD"
    - name: collect the delta
      shell: bash
      env:
        PR: ${{ github.event.pull_request.number }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        out="$GITHUB_WORKSPACE/.santa-pr/santa/.santa/pr"
        cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
        mkdir -p "$GITHUB_WORKSPACE/.santa-pr/artifact"
        cp "$out/comment.md" "$out/delta.json" "$GITHUB_WORKSPACE/.santa-pr/artifact/"
        # where the detail is: every entry in the job summary, a build error in the log
        printf '\n[The check run](%s/%s/actions/runs/%s): every entry in its job summary, any build error in its log.\n' \
          "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_WORKSPACE/.santa-pr/artifact/comment.md"
        # The commenter does not trust these: it posts only to the open pull request whose head is PR_HEAD.
        jq -n --arg number "$PR" --arg head "$PR_HEAD" '{number: $number, head: $head}' \
          > "$GITHUB_WORKSPACE/.santa-pr/artifact/pr.json"
    - name: upload the delta
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: santa-pr
        path: .santa-pr/artifact/
        retention-days: 7
