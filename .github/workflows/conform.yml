name: conform

# Manual only — the project is in active, high-churn development and the full grid is a
# cold-heavy build (sbt builds the Scala node, cargo builds sigma-rust x2, npm builds
# ergots + ts-runner). Run it from the Actions tab ("Run workflow") when you want a
# canonical clean-environment grid run. Auto-on-push can be added later.
#
# Naming note: runner count is discovered at run time (whatever lives under runners/),
# so nothing here hardcodes an N — the actual N-way lands in the run summary.
on:
  workflow_dispatch:

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write          # force-push the generated scoreboard to gh-pages
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive          # blitzen-develop / blitzen-eni
      - name: Install mise (binary only — runners + SANTA's own tooling self-provision)
        uses: jdx/mise-action@v4
        with:
          version: 2026.5.18
          install: false                 # no root config by design; each wrapper/santa-run does `mise install`
      # ── ergo-core (tx-tier oracle dep) ──────────────────────────────────────────
      # Not on Maven: publishLocal'd from the upstream node at the pinned tag — the same
      # artifacts the local blesser uses (ergo-node-build is that tag, verified clean).
      # Cached by tag; a hit skips the node build entirely. SANTA_TX_BLESSER=1 then
      # compiles rudolph's transaction arm, giving the tx slice its control row in the
      # canonical grid (an ergo-core-less build degrades to not-implemented instead).
      - name: cache ergo-core publishLocal artifacts
        id: ergo-core
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/org.ergoplatform
          key: ergo-core-v6.0.2.1
      - name: publish ergo-core @ v6.0.2.1
        if: steps.ergo-core.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v6.0.2.1 https://github.com/ergoplatform/ergo.git /tmp/ergo
          mise trust runners/rudolph/mise.toml
          mise --cd runners/rudolph install
          cd /tmp/ergo
          mise --cd "$GITHUB_WORKSPACE/runners/rudolph" exec -- \
            sbt -batch avldb/publishLocal ergoWallet/publishLocal ergoCore/publishLocal
      - name: schema gate
        run: ./validate
      - name: conformance grid
        run: ./conform
        env:
          SANTA_TX_BLESSER: "1"
      - name: grid summary (the dynamic N-way)
        run: |
          jq -r '.runners
                 | "## \(length)-way conformance grid\n"
                   + (map("- **\(.name)** (`\((.sha // "in-tree")[0:9])`): red_total \(.red_total)")
                      | join("\n"))' \
            .santa/results.json >> "$GITHUB_STEP_SUMMARY"
      - name: scoreboard
        run: ./scoreboard
        env:
          SANTA_SCOREBOARD_REF: ${{ github.sha }}
      - name: publish scoreboard to gh-pages
        run: |
          cd site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name=santa-ci -c user.email=ci@santa.local commit -q -m "scoreboard @ ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
