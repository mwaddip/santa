name: conform

# Manual only — the project is in active, high-churn development and the 4-way is a
# cold-heavy build (sbt builds the Scala node, cargo builds sigma-rust x2, npm builds
# ergots + ts-runner). Run it from the Actions tab ("Run workflow") when you want a
# canonical clean-environment 4-way. Auto-on-push can be added later.
on:
  workflow_dispatch:

jobs:
  four-way:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # blitzen-develop / blitzen-eni
      - name: Install mise (binary only — runners self-provision their toolchains)
        uses: jdx/mise-action@v2
        with:
          version: 2026.5.18
          install: false                 # no root config by design; each santa-run does `mise install`
      - name: 4-way conformance
        run: ./conform
